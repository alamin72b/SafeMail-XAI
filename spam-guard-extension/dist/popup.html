<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpamGuard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Gmail protection</p>
          <h1>SpamGuard</h1>
          <p class="lede">
            Clean, session-based spam checks for the latest email in view.
          </p>
        </div>
        <div class="hero-badge">Live</div>
      </header>

      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>Latest scan</h2>
            <p id="scan-summary" class="section-copy"></p>
          </div>
        </div>
        <div id="current-verdict" class="verdict-card"></div>
        <div class="actions">
          <button id="why-button" type="button" hidden>Why this verdict?</button>
        </div>
        <div id="explanation-panel" class="explanation" hidden></div>
      </section>

      <section class="panel">
        <div class="section-heading">
          <div>
            <h2>Recent scans</h2>
            <p class="section-copy">Stored locally for this browser session.</p>
          </div>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

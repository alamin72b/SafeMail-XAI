<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpamGuard Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <p class="eyebrow">Extension settings</p>
        <h1>SpamGuard</h1>
        <p class="lede">
          Point the extension at your API endpoint and keep Gmail scans in sync.
        </p>
      </section>

      <section class="panel">
        <form id="settings-form" class="form">
          <label for="api-base-url">API base URL</label>
          <input
            id="api-base-url"
            type="text"
            spellcheck="false"
            autocomplete="off"
            inputmode="url"
          />
          <p class="hint">Default: http://localhost:4000/api/v1</p>
          <div class="actions">
            <button type="submit">Save settings</button>
          </div>
          <p id="status" class="status"></p>
        </form>
      </section>
    </main>
    <script src="options.js"></script>
  </body>
</html>
